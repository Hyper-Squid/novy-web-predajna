{% extends "base.html" %}

{% block content %}

<h1>⚙️ Admin panel</h1>

<a href="/admin/logout">Odhlásiť sa</a>

<section class="admin">

    <h2>Pridať produkt</h2>

    <form method="POST" action="/admin/add">

        <input name="name"
        placeholder="Názov produktu" required>

        <select name="category">
            <option value="Ovocie">Ovocie</option>
            <option value="Zelenina">Zelenina</option>
        </select>

        <input name="price"
        type="number"
        step="0.01"
        min="0"
        placeholder="Cena za kg"
        required>

        <input name="description"
        placeholder="Popis produktu">

        <button type="submit">Pridať produkt</button>

    </form>

</section>

<section class="admin">

    <h2>Produkty v obchode</h2>

    {% for product in products %}

    <div class="cart-item">

        <strong>{{ product.name }}</strong>

        <span>{{ "%.2f"|format(product.price) }} €</span>

        <form method="POST"
        action="{{ url_for('delete_product', product_id=product.id) }}">

            <button class="delete" type="submit">
                Odstrániť
            </button>

        </form>

    </div>

    {% endfor %}

</section>

{% endblock %}
